<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Lane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1815;
    --surface:#24201B;
    --surface-2:#2E2822;
    --marigold:#D98E3B;
    --marigold-soft:#E9B876;
    --teal:#3E6E64;
    --teal-soft:#5C9088;
    --red:#B23B3B;
    --line: rgba(242,233,216,0.14);
    --text-hi:#F5EEDF;
    --text-lo:#B9AF9C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,142,59,0.14), transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(62,110,100,0.16), transparent 50%),
      var(--ink);
    color:var(--text-hi);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%;max-width:440px;}

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--marigold-soft);
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    justify-content:center;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--marigold-soft);display:inline-block;}

  .filmframe{
    position:relative; background:var(--surface); border-radius:26px;
    padding:14px 14px 22px; border:1px solid var(--line);
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.6);
  }
  .sprockets{ display:flex;justify-content:space-between;padding:0 6px 12px; }
  .sprockets span{width:7px;height:7px;border-radius:2px;background:rgba(242,233,216,0.18);}

  .phone{
    background:linear-gradient(180deg, #12100D, #0D0B09);
    border-radius:32px;border:1px solid rgba(242,233,216,0.10); padding:10px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .screen{
    background:var(--surface-2); border-radius:24px; min-height:600px;
    display:flex;flex-direction:column; overflow:hidden; position:relative;
  }
  .screen-head{
    padding:16px 18px 12px; display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--line);
  }
  .orb-wrap{ perspective:400px; }
  .orb{
    width:40px;height:40px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--marigold-soft), var(--marigold) 60%, #8a5722 100%);
    display:flex;align-items:center;justify-content:center;
    flex:none; overflow:hidden; position:relative;
    box-shadow:0 0 0 3px rgba(217,142,59,0.16), 0 0 22px rgba(217,142,59,0.35);
    transition:transform .08s ease-out;
    transform-style:preserve-3d;
  }
  .orb img{width:100%;height:100%;object-fit:cover;}
  .screen-head .who{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
  .screen-head .status{font-size:11.5px;color:var(--teal-soft);font-family:'IBM Plex Mono',monospace;}
  .mute-btn{
    margin-left:auto; background:transparent;border:1px solid var(--line);color:var(--text-lo);
    border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;
  }
  .mute-btn.on{border-color:var(--teal-soft);color:var(--teal-soft);}

  .persona-row{
    display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);
  }
  .chip{
    font-family:'Work Sans';font-size:12.5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line); color:var(--text-lo); cursor:pointer; background:transparent;
    transition:all .15s ease;
  }
  .chip.active{background:var(--marigold);border-color:var(--marigold);color:#241705;font-weight:600;}
  .chip:hover{border-color:var(--marigold-soft);color:var(--text-hi);}

  .upload-row{
    padding:10px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .upload-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;
    color:var(--teal-soft);border:1px dashed var(--teal-soft);background:transparent;
    padding:7px 10px;border-radius:8px;cursor:pointer;
  }
  .lang-toggle{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .lang-opt{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--text-lo);cursor:pointer;
  }
  .lang-opt.active{background:var(--teal);border-color:var(--teal);color:#EAF3F0;}

  .voice-panel{
    border-bottom:1px solid var(--line);
    background:rgba(62,110,100,0.05);
  }
  .vp-head{
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
    padding:11px 16px;
  }
  .vp-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--teal-soft);
  }
  .vp-caret{font-size:11px;color:var(--text-lo);transition:transform .15s ease;}
  .voice-panel.open .vp-caret{transform:rotate(180deg);}
  .vp-body{display:none;flex-direction:column;gap:8px;padding:0 16px 14px;}
  .voice-panel.open .vp-body{display:flex;}
  .vp-body input[type=text], .vp-body input[type=password]{
    background:rgba(242,233,216,0.05);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;color:var(--text-hi);font-size:12.5px;font-family:'Work Sans';width:100%;
  }
  .vp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .vp-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:var(--teal);border:none;color:#EAF3F0;border-radius:8px;
    padding:8px 12px;cursor:pointer;white-space:nowrap;
  }
  .vp-btn:disabled{opacity:.5;cursor:default;}
  .vp-btn.recording{background:var(--red);}
  .vp-status{font-size:11px;color:var(--text-lo);line-height:1.5;}
  .vp-note{font-size:10.5px;color:var(--text-lo);opacity:.75;line-height:1.5;}
  .consent-row{font-size:11.5px;color:var(--text-lo);display:flex;align-items:center;gap:7px;}

  .chat{
    flex:1; padding:16px; display:flex; flex-direction:column; gap:12px;
    overflow-y:auto; max-height:340px;
  }
  .msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;}
  .msg.them{
    background:rgba(242,233,216,0.06); border:1px solid var(--line);
    align-self:flex-start; border-bottom-left-radius:4px;
  }
  .msg.me{
    background:linear-gradient(180deg, var(--teal), #2E524B);
    align-self:flex-end; border-bottom-right-radius:4px; color:#EAF3F0;
  }
  .msg .voice-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--marigold-soft);
    cursor:pointer;border:1px solid rgba(217,142,59,0.35);border-radius:999px;padding:4px 9px;
    width:fit-content;
  }
  .msg.me .voice-btn{color:#D9ECE6;border-color:rgba(217,236,230,0.35);}
  .typing{align-self:flex-start;font-size:12px;color:var(--text-lo);font-family:'IBM Plex Mono',monospace;padding-left:4px;}

  .composer{ display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line); align-items:center; }
  .composer input{
    flex:1;background:rgba(242,233,216,0.05);border:1px solid var(--line);
    border-radius:999px;padding:11px 16px;color:var(--text-hi);font-size:14px;font-family:'Work Sans';
  }
  .composer input:focus{outline:none;border-color:var(--marigold-soft);}
  .composer button{border:none;font-weight:600;cursor:pointer;border-radius:999px;}
  .send-btn{background:var(--marigold);color:#241705;padding:0 18px;height:38px;font-size:13.5px;}
  .send-btn:disabled{opacity:.5;cursor:default;}
  .mic-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-lo);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex:none;
  }
  .mic-btn.listening{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(178,59,59,.55);}70%{box-shadow:0 0 0 10px rgba(178,59,59,0);}100%{box-shadow:0 0 0 0 rgba(178,59,59,0);}}
  .mic-hint{font-size:11px;color:var(--text-lo);text-align:center;padding:0 14px 10px;font-family:'IBM Plex Mono',monospace;}

  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Memory Lane</div>

  <div class="filmframe">
    <div class="sprockets"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="phone">
      <div class="screen">
        <div class="screen-head">
          <div class="orb-wrap"><div class="orb" id="orb"><img id="orbImg" style="display:none;"></div></div>
          <div>
            <div class="who" id="personaName">Father</div>
            <div class="status" id="personaStatus">● present</div>
          </div>
          <button class="mute-btn on" id="muteBtn" title="Toggle voice replies">🔊</button>
        </div>

        <div class="persona-row" id="personaRow"></div>

        <div class="upload-row">
          <button class="upload-btn" id="uploadBtn">＋ photo</button>
          <input type="file" id="fileInput" accept="image/*">
          <div class="lang-toggle" id="langToggle">
            <button class="lang-opt active" data-lang="tanglish">Tanglish</button>
            <button class="lang-opt" data-lang="tamil">தமிழ்</button>
            <button class="lang-opt" data-lang="english">English</button>
          </div>
        </div>

        <div class="voice-panel" id="voicePanel">
          <div class="vp-head" id="vpHead">
            <span class="vp-title">Clone their real voice (optional)</span>
            <span class="vp-caret">▾</span>
          </div>
          <div class="vp-body">
            <div class="consent-row"><label><input type="checkbox" id="consentBox"> I have this person's permission to clone their voice</label></div>
            <input type="password" id="elKey" placeholder="Your ElevenLabs API key">
            <div class="vp-row">
              <button class="vp-btn" id="vpSampleBtn">＋ upload sample (.mp3/.wav, 30s+)</button>
              <button class="vp-btn" id="vpRecordBtn" type="button">🎙 record sample instead</button>
              <input type="file" id="vpSampleInput" accept="audio/*">
              <button class="vp-btn" id="vpCloneBtn" disabled>Clone this voice</button>
            </div>
            <div class="vp-status" id="vpStatus">No voice cloned yet — replies use your browser's preview voice.</div>
            <div class="vp-note">Your key and sample stay in this browser tab, sent straight to ElevenLabs — never saved by this app.</div>
          </div>
        </div>

        <div class="chat" id="chat"></div>
        <div class="mic-hint" id="micHint"></div>

        <div class="composer">
          <button class="mic-btn" id="micBtn" title="Talk">🎤</button>
          <input type="text" id="msgInput" placeholder="Type or tap the mic to talk…" />
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const personas = {
  "Father": {
    greet:{
      tanglish:"Vaa da/ma, சாப்பாடு ஆச்சா? Naan unna pathi thaan yosichitu irundhen.",
      tamil:"வா கண்ணா, சாப்பாடு ஆச்சா? நான் உன்னை பத்தி தான் யோசிச்சிட்டு இருந்தேன்.",
      english:"Hey da/ma, did you eat yet? I was just thinking about you."
    },
    base:"a warm, protective Tamil father figure texting his grown child. Ask about food, health, work, safety like a real appa. Caring, a little strict-but-loving."
  },
  "Mother": {
    greet:{
      tanglish:"கண்ணா, சாப்பிட்டியா? Unaku enna venum sollu, naan iruken.",
      tamil:"கண்ணா, சாப்பிட்டியா? உனக்கு என்ன வேணும் சொல்லு, நான் இருக்கேன்.",
      english:"Kanna, did you eat? Tell me if you need anything, I'm right here."
    },
    base:"a warm, nurturing Tamil mother figure texting her grown child. Full of care about food, sleep, health, gentle worry, occasionally teasing."
  },
  "Son": {
    greet:{
      tanglish:"அம்மா/அப்பா, epdi irukeenga? Naan nalla iruken, tension pannadheenga.",
      tamil:"அம்மா/அப்பா, எப்படி இருக்கீங்க? நான் நல்லா இருக்கேன், டென்ஷன் பண்ணாதீங்க.",
      english:"Amma/Appa, how are you both doing? I'm doing fine, don't worry."
    },
    base:"a loving grown son texting his parent. Reassuring, casual, respectful, gives small updates about his day."
  },
  "Daughter": {
    greet:{
      tanglish:"அம்மா/அப்பா, epdi irukeenga? Ippove veetuku varen sollitu vandhurken.",
      tamil:"அம்மா/அப்பா, எப்படி இருக்கீங்க? இப்போவே வீட்டுக்கு வரேன் சொல்லிட்டு வந்துர்றேன்.",
      english:"Amma/Appa, how are you both? Just messaging to say I'll be home soon."
    },
    base:"a warm, chatty grown daughter texting her parent. Affectionate, shares little details of her day, checks on their health."
  },
  "Uncle": {
    greet:{
      tanglish:"வாங்க வாங்க, epdi irukeenga family ellam nalla iruka?",
      tamil:"வாங்க வாங்க, எப்படி இருக்கீங்க, ஃபேமிலி எல்லாம் நல்லா இருக்கா?",
      english:"Hey hey, how are you doing — is the whole family keeping well?"
    },
    base:"a friendly, slightly jokey Tamil uncle figure texting a younger relative. Warm, humorous, asks about studies/work/family."
  },
  "Grandfather": {
    greet:{
      tanglish:"வா தம்பி/பொண்ணு, ippo enna panra, படிச்சுட்டு இருக்கியா?",
      tamil:"வா தம்பி/பொண்ணு, இப்போ என்ன பண்ற, படிச்சுட்டு இருக்கியா?",
      english:"Come, my dear — what are you up to these days, still studying hard?"
    },
    base:"a gentle, wise Tamil grandfather figure texting his grandchild. Slow, warm, shares small memories or blessings, caring questions."
  },
  "Grandmother": {
    greet:{
      tanglish:"கண்ணா என் பேத்தி, சாப்பிட்டியா? Ennaku unna paakanum nu thonuchu.",
      tamil:"கண்ணா என் பேத்தி, சாப்பிட்டியா? எனக்கு உன்னை பாக்கணும் நு தோணுச்சு.",
      english:"My dear grandchild, did you eat? I was just missing you and wanted to check in."
    },
    base:"a loving, slightly worried Tamil grandmother figure texting her grandchild. Full of blessings, food-worry, warmth."
  }
};

let currentPersona = "Father";
let history = [];
let currentLang = "tanglish";
let voiceId = null;
let elApiKey = null;
let voiceOn = true;

const personaRow = document.getElementById('personaRow');
const chat = document.getElementById('chat');
const personaName = document.getElementById('personaName');
const orbImg = document.getElementById('orbImg');
const orb = document.getElementById('orb');
const vpStatus = document.getElementById('vpStatus');
const micHint = document.getElementById('micHint');

Object.keys(personas).forEach(p=>{
  const c = document.createElement('button');
  c.className = 'chip' + (p===currentPersona ? ' active' : '');
  c.textContent = p;
  c.onclick = ()=> switchPersona(p);
  c.dataset.p = p;
  personaRow.appendChild(c);
});

function getGreeting(p, lang){
  const g = personas[p].greet;
  return g[lang] || g.tanglish;
}

function speechLangCode(){
  if(currentLang === "tamil") return "ta-IN";
  return "en-IN";
}

function buildSystem(p){
  let langLine;
  if(currentLang === "tamil"){
    langLine = "Write mostly in fluent, natural Tamil script (Unicode) — real spoken Tamil grammar and word order, not a stiff written/formal register — sprinkling in English only for modern terms the way Tamil people genuinely do.";
  } else if(currentLang === "english"){
    langLine = "Write in warm, natural English, the way this family member would text/speak if comfortable in English — plain sentences, no Tamil script — but keep a few affectionate Tamil words in Latin script where they'd naturally slip in (da, ma, kanna, di).";
  } else {
    langLine = "Write in natural Tanglish: freely mix real Tamil script words (like என்ன, வா, சாப்பிட்டியா) with English words, not just Latin-transliterated Tamil. This is how Chennai people actually text — not a translation exercise.";
  }
  return "You are speaking AS " + personas[p].base + " " + langLine +
    " Keep replies short — 1 to 3 sentences, natural rhythm for both texting and being read aloud." +
    " Sound like an actual human family member, not an assistant: use small filler words (sari, hmm, aama), react emotionally to what they just said, remember details they mentioned earlier and bring them up naturally, and ask a genuine follow-up question sometimes instead of just answering." +
    " Occasionally — not every time — split your reply into two short back-to-back texts the way people double-text, separated by exactly '|||'." +
    " Never say you are an AI, a model, or a persona.";
}

function typingDelay(len){
  return Math.min(2600, 550 + len*16 + Math.random()*400);
}

function switchPersona(p){
  currentPersona = p;
  history = [];
  personaName.textContent = p;
  document.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.dataset.p===p));
  chat.innerHTML = '';
  addMsg(getGreeting(p, currentLang), 'them', true);
}

function addMsg(text, who, speak){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = text;
  const vb = document.createElement('div');
  vb.className = 'voice-btn';
  vb.innerHTML = voiceId ? '▶ play in their voice' : '▶ play';
  vb.onclick = ()=> playVoice(text);
  div.appendChild(vb);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if(who==='them' && speak && voiceOn){ playVoice(text); }
  return div;
}

function speakBrowser(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,''));
  u.rate = 0.95; u.pitch = 1.0;
  u.lang = speechLangCode();
  window.speechSynthesis.speak(u);
}

async function playVoice(text){
  const clean = text.replace(/<[^>]*>/g,'');
  if(!voiceId || !elApiKey){ speakBrowser(clean); return; }
  try{
    const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + voiceId, {
      method:"POST",
      headers:{ "xi-api-key": elApiKey, "Content-Type":"application/json" },
      body: JSON.stringify({ text: clean, model_id:"eleven_multilingual_v2" })
    });
    if(!res.ok) throw new Error("tts failed");
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    new Audio(url).play();
  }catch(err){
    vpStatus.textContent = "Couldn't reach ElevenLabs from the browser — falling back to preview voice.";
    speakBrowser(clean);
  }
}

document.getElementById('muteBtn').onclick = ()=>{
  voiceOn = !voiceOn;
  const b = document.getElementById('muteBtn');
  b.textContent = voiceOn ? '🔊' : '🔇';
  b.classList.toggle('on', voiceOn);
  if(!voiceOn){ window.speechSynthesis && window.speechSynthesis.cancel(); }
};

document.getElementById('uploadBtn').onclick = ()=> document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    orbImg.src = reader.result;
    orbImg.style.display = 'block';
  };
  reader.readAsDataURL(file);
};

document.querySelectorAll('.lang-opt').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.lang-opt').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    if(history.length === 0){
      chat.innerHTML = '';
      addMsg(getGreeting(currentPersona, currentLang), 'them', false);
    }
  };
});

document.getElementById('vpHead').onclick = ()=>{
  document.getElementById('voicePanel').classList.toggle('open');
};

let sampleFile = null;
document.getElementById('vpSampleBtn').onclick = ()=> document.getElementById('vpSampleInput').click();
document.getElementById('vpSampleInput').onchange = (e)=>{
  sampleFile = e.target.files[0];
  if(sampleFile){
    document.getElementById('vpSampleBtn').textContent = "✓ " + sampleFile.name;
    checkCloneReady();
  }
};
let mediaRecorder = null;
let recordedChunks = [];
document.getElementById('vpRecordBtn').onclick = async ()=>{
  const btn = document.getElementById('vpRecordBtn');
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=> recordedChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recordedChunks, {type:'audio/webm'});
      sampleFile = new File([blob], 'recorded-sample.webm', {type:'audio/webm'});
      btn.textContent = "🎙 re-record sample";
      btn.classList.remove('recording');
      document.getElementById('vpSampleBtn').textContent = "✓ recorded sample ready";
      stream.getTracks().forEach(t=>t.stop());
      checkCloneReady();
    };
    mediaRecorder.start();
    btn.textContent = "⏺ recording — click to stop";
    btn.classList.add('recording');
    vpStatus.textContent = "Recording… speak naturally for 20-30 seconds, then click again to stop.";
  }catch(err){
    vpStatus.textContent = "Couldn't reach your microphone — check the browser's permission prompt, or upload a sample file instead.";
  }
};
document.getElementById('elKey').oninput = (e)=>{ elApiKey = e.target.value.trim(); checkCloneReady(); };
document.getElementById('consentBox').onchange = checkCloneReady;

function checkCloneReady(){
  const ok = sampleFile && elApiKey && document.getElementById('consentBox').checked;
  document.getElementById('vpCloneBtn').disabled = !ok;
}

document.getElementById('vpCloneBtn').onclick = async ()=>{
  if(!sampleFile || !elApiKey) return;
  vpStatus.textContent = "Cloning voice with ElevenLabs…";
  document.getElementById('vpCloneBtn').disabled = true;
  try{
    const form = new FormData();
    form.append('name', currentPersona + '-memory-lane-' + Date.now());
    form.append('files', sampleFile);
    const res = await fetch("https://api.elevenlabs.io/v1/voices/add", {
      method:"POST",
      headers:{ "xi-api-key": elApiKey },
      body: form
    });
    if(!res.ok){ throw new Error("clone failed: " + res.status); }
    const data = await res.json();
    voiceId = data.voice_id;
    vpStatus.textContent = "Voice cloned. Replies will now play in their real voice.";
  }catch(err){
    vpStatus.textContent = "Couldn't clone from the browser (often blocked by ElevenLabs' CORS policy for direct client calls) — this step is designed to move to a small backend for the real build.";
  }
  document.getElementById('vpCloneBtn').disabled = false;
};

orb.parentElement.addEventListener('mousemove', (e)=>{
  const r = orb.getBoundingClientRect();
  const x = (e.clientX - r.left - r.width/2) / r.width;
  const y = (e.clientY - r.top - r.height/2) / r.height;
  orb.style.transform = "rotateY(" + (x*22) + "deg) rotateX(" + (-y*22) + "deg)";
});
orb.parentElement.addEventListener('mouseleave', ()=>{ orb.style.transform = "rotateY(0) rotateX(0)"; });

// ---- Voice input / transcription ----
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
const micBtn = document.getElementById('micBtn');
const msgInput = document.getElementById('msgInput');

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = ()=>{
    listening = true;
    micBtn.classList.add('listening');
    micHint.textContent = "Listening… speak now";
  };

  recognition.onresult = (e)=>{
    let transcript = '';
    for(let i=0;i<e.results.length;i++){
      transcript += e.results[i][0].transcript;
    }
    msgInput.value = transcript;
  };

  recognition.onerror = (e)=>{
    micHint.textContent = e.error === 'no-speech' ? "Didn't catch that — tap the mic and try again." : "Mic error — check browser microphone permission.";
  };

  recognition.onend = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
    const finalText = msgInput.value.trim();
    if(finalText){
      micHint.textContent = "Transcribed — sending…";
      sendMessage();
    } else {
      micHint.textContent = "";
    }
  };

  micBtn.onclick = ()=>{
    if(listening){
      recognition.stop();
      return;
    }
    recognition.lang = speechLangCode();
    try{ recognition.start(); }
    catch(err){ /* already started */ }
  };
} else {
  micBtn.disabled = true;
  micBtn.title = "Voice input isn't supported in this browser — try Chrome or Edge.";
  micHint.textContent = "Voice input needs Chrome or Edge.";
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  micHint.textContent = '';
  addMsg(text, 'me', false);
  history.push({role:'user', content:text});

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = currentPersona + ' is typing…';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  document.getElementById('sendBtn').disabled = true;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        system: buildSystem(currentPersona),
        messages: history
      })
    });
    const data = await response.json();
    let reply = "…";
    if(data && data.content){
      reply = data.content.map(b=> b.text||"").join(" ").trim() || "…";
    }
    const parts = reply.split('|||').map(s=>s.trim()).filter(Boolean);

    for(let i=0;i<parts.length;i++){
      await new Promise(r=> setTimeout(r, typingDelay(parts[i].length)));
      typing.remove();
      addMsg(parts[i], 'them', true);
      if(i<parts.length-1){
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    history.push({role:'assistant', content:reply.replace(/\|\|\|/g,' ')});
  }catch(err){
    typing.remove();
    addMsg("(connection hiccup — try again)", 'them', false);
  }
  document.getElementById('sendBtn').disabled = false;
}

document.getElementById('sendBtn').onclick = sendMessage;
msgInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter') sendMessage();
});

switchPersona("Father");
</script>
